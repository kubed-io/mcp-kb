# Generated by `python -m kubed.mcp.pyroscope --write kubed-mcp-kb` inside the server's image.
# Regenerate it there rather than edit it: CI checks it with --check.
version: v1
source_code:
  mappings:
  - path:
    - prefix: /opt/venv/lib/python3.14/site-packages/kubed/mcp_kb/
    - prefix: opt/venv/lib/python3.14/site-packages/kubed/mcp_kb/
    language: python
    source:
      local:
        path: kubed/mcp_kb
  - path:
    - prefix: /opt/venv/lib/python3.14/site-packages/kubed/mcp/
    - prefix: opt/venv/lib/python3.14/site-packages/kubed/mcp/
    language: python
    source:
      github:
        owner: kubed-io
        repo: quick-mcp
        ref: v0.8.0
        path: kubed/mcp
  - path:
    - prefix: /opt/venv/lib/python3.14/site-packages/fastmcp/
    - prefix: opt/venv/lib/python3.14/site-packages/fastmcp/
    language: python
    source:
      github:
        owner: PrefectHQ
        repo: fastmcp
        ref: v4.2.6
        path: fastmcp_slim/fastmcp
  - path:
    - prefix: /usr/local/lib/python3.14/
    - prefix: usr/local/lib/python3.14/
    language: python
    source:
      github:
        owner: python
        repo: cpython
        ref: v3.14.10
        path: Lib
