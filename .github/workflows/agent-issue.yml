name: 🧭 Agent · Issue

# The spec agent on an issue: kubed-io/actions' agent-issue.yml says what it does.

on:
  # n8n sends it (Agent flow · intake)
  repository_dispatch:
    types: [agent-issue]

permissions: {}

jobs:
  agent:
    name: Agent
    uses: kubed-io/actions/.github/workflows/agent-issue.yml@main
    with:
      # the generated pages (scripts/generate_wiki.py); the specs and plans are in docs/
      wiki: wiki
    secrets: inherit
    permissions:
      contents: read
      issues: write
