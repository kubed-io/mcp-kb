name: 🧹 Lint

# The static gates, kept out of test.yml so a red here names the thing that is wrong
# instead of burying it in a test run. Three independent jobs, all fast, all parallel:
#
#   Dependency Audit  pip-audit over the resolved RUNTIME dependency set
#   Dockerfile Lint   hadolint over the image that actually ships
#   OpenAPI Spec      redocly over the generated /health, /reindex contract
#
# A failure here is the code agent's to fix before any review (pr.yml's collector). The
# scanners, whose findings go to code scanning, are quality.yml.

on:
  # pull requests: pr.yml calls this, with every other gate, so one collector sees them all
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Known-vulnerability audit of what the IMAGE actually installs.
  # ---------------------------------------------------------------------------
  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        # setuptools_scm resolves the version from history at install time.
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: pyproject.toml

    # Runtime only. The test extra is deliberately NOT installed here: ruff and
    # pytest never reach a user, and an advisory against a test-only tool that
    # stops a release is noise, not security.
    - name: Install Runtime Dependencies
      run: pip install --editable .

    # --exclude-editable drops kubed-mcp-kb itself. It is not on PyPI, so
    # leaving it in makes pip-audit fail to resolve the very package being
    # audited — which reads like a broken audit rather than a missing release.
    - name: Freeze Runtime Dependencies
      run: pip freeze --exclude-editable > requirements.txt

    - name: Audit Dependencies
      uses: pypa/gh-action-pip-audit@v1.1.0
      with:
        inputs: requirements.txt
        summary: true

    - name: Upload Resolved Dependencies
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: requirements-lock
        path: requirements.txt
        if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The image is what this repo deploys, so its Dockerfile gets a linter. Rule
  # exclusions and their reasons live in .hadolint.yaml.
  # ---------------------------------------------------------------------------
  docker:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    # `info` and `style` findings are advice; `warning` and above are the ones
    # worth failing a merge over.
    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning

  # ---------------------------------------------------------------------------
  # openapi.yaml is a build artifact, not a tracked file, so it has to be
  # written before it can be linted. Linting it the way a consumer's tooling
  # would read it catches what pytest's own assertions do not.
  # ---------------------------------------------------------------------------
  spec:
    name: OpenAPI Spec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: pyproject.toml

    # The generator imports the package to build the spec, so the package
    # itself is the dependency, not just a YAML writer.
    - name: Install
      run: pip install .

    - name: Generate OpenAPI
      run: python scripts/generate_openapi.py

    # Pinned to a major rather than @latest: an unpinned linter can turn main
    # red on a release nobody in this repo made. Dependabot does not watch
    # `npx`, so this line is bumped by hand when a major lands.
    - name: Lint OpenAPI
      run: npx --yes @redocly/cli@2 lint openapi.yaml

    - name: Upload OpenAPI Spec
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: openapi-spec
        path: openapi.yaml
        if-no-files-found: error
