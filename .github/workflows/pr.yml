name: 🔀 PR

# Every gate a pull request must pass, in one run: PR Tasks here, the rest called from
# their own workflows, and the `Checks` collector after them all. The collector gathers
# what failed (steps, annotations, the end of the logs) into the `checks-report` artifact;
# on a PR with the `agent` label it then sends the `agent-review` dispatch, and
# agent-review.yml, from main, hands a failure to the code agent or the PR to the review
# agent. A PR without the label wakes no agent. The scanners (quality.yml), whose findings go
# to code scanning, and wiki.yml run on their own triggers. The image is not a PR gate at all
# (see image.yml).
#
# PR Tasks: every PR must contribute a CHANGELOG entry, because that [Unreleased] section
# becomes the release notes at publish time. A PR with no new entry fails here.
#
# There are two escape hatches, and they cover different things:
#
#   the `no changelog` label   a judgement call by a human, for work a user
#                              would not read about in release notes
#   the Dependabot guard below unconditional, because a bump is never that work
#
# Dependabot also *applies* the label via .github/dependabot.yml, so the guard
# looks redundant. It is not. Dependabot can only apply a label that already
# EXISTS in the repository and drops any that does not, silently and with no
# warning anywhere — and a label is repository state that anyone can rename or
# delete, while this guard is in the workflow with the rule it protects.

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled so applying the `no changelog` label (e.g. Dependabot,
    # or a late add) re-runs the gate with a fresh payload. A draft runs
    # nothing; ready_for_review starts the checks.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

# a push cancels the checks it outdates; a label run is apart, so it never cancels them, and
# so is a draft's: a push and Mark Ready land together, and the push's draft payload must
# not cancel the checks ready_for_review started
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && 'labels' || github.event.pull_request.draft && 'draft' || 'checks' }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-tasks:
    name: PR Tasks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Auto-assign needs to write the assignee on the PR.
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Nothing here pushes; the two actions below talk to the API with the
        # job's token, not with a git remote.
        persist-credentials: false

    # Assign the PR author to their own PR per .github/assign.yml.
    - name: Auto Assign
      uses: kentaro-m/auto-assign-action@v2.0.2
      with:
        configuration-path: .github/assign.yml

    # `pull_request.user.login`, not `github.actor`: on a `labeled` event the
    # actor is whoever applied the label, so a human touching a Dependabot PR
    # would put the gate back. The author is what actually identifies the PR.
    - name: Make sure Changelog is updated
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      uses: tarides/changelog-check-action@v4
      with:
        changelog: CHANGELOG.md

  # The checks. A label event runs PR Tasks alone: these skip at the caller, which
  # reports the caller's name only, so a skip never stands in for a required check.
  # A draft runs none of them either.
  test:
    name: Test
    if: ${{ !github.event.pull_request.draft && !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/test.yml
    secrets: inherit
    permissions:
      contents: read

  lint:
    name: Lint
    if: ${{ !github.event.pull_request.draft && !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    permissions:
      contents: read

  package:
    name: Package
    if: ${{ !github.event.pull_request.draft && !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/package.yml
    secrets: inherit
    permissions:
      contents: read

  # What failed, for whoever fixes it: never an agent here, since this run is the PR's own
  # copy of the workflow. It always succeeds; the checks themselves are what gate.
  checks:
    name: Checks
    needs: [pr-tasks, test, lint, package]
    if: >-
      always() && !github.event.pull_request.draft &&
      !contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
      # the `agent-review` dispatch
      contents: write
    steps:

    # what failed, for the code agent: the step summary and the checks-report artifact
    - name: Report
      id: report
      uses: kubed-io/actions/pr-checks/report@main

    # an agent's PR, its checks done: the review agent's turn (agent-review.yml, from main).
    # The payload is a pointer: review-route reads the run back for the result and the actor
    - name: Hand to the Review Agent
      # a cancelled run is no verdict: its cancelled jobs would read as failed
      if: "!cancelled() && contains(github.event.pull_request.labels.*.name, 'agent')"
      env:
        GH_TOKEN: ${{ github.token }}
        NUMBER: ${{ github.event.pull_request.number }}
        SHA: ${{ github.event.pull_request.head.sha }}
        FAILED: ${{ steps.report.outputs.failed }}
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=agent-review \
          -F "client_payload[pull_request]=${NUMBER}" -f "client_payload[reason]=checks" \
          -F "client_payload[run_id]=${GITHUB_RUN_ID}" -f "client_payload[sha]=${SHA}" \
          -F "client_payload[failed]=${FAILED:-0}"
