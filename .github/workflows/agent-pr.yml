name: 🛠️ Agent · Pull Request

# The plan and code agents on a PR from an issue: kubed-io/actions' agent-pr.yml says what
# they do.

on:
  # n8n relays this: Agent flow · intake (spec §8.4)
  # issue_comment:
  #   types: [created]
  # pull_request_target:
  #   types: [labeled]
  # n8n relays this: Agent flow · intake (spec §8.4)
  # workflow_run:
  #   workflows: [Agent Relay]
  #   types: [completed]
  repository_dispatch:
    types: [agent-code, agent-route]

permissions: {}

jobs:
  agent:
    name: Agent
    uses: kubed-io/actions/.github/workflows/agent-pr.yml@main
    with:
      # the generated pages (scripts/generate_wiki.py); the specs and plans are in docs/
      wiki: wiki
    secrets: inherit
    permissions:
      contents: read
      issues: read
      pull-requests: read
      # the checks report, an artifact of pr.yml's run
      actions: read
      # pr-checks: the alerts and the annotations
      checks: read
      security-events: read
